name: dunning-integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        run: corepack enable
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
